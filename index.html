<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machinist Bench Vise — procedural Three.js scene</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui" hidden>
      <h1>Machinist bench vise</h1>
      <p class="sub">Procedural Three.js reconstruction &mdash; <span id="pass-label">blockout</span></p>
      <label>Extra jaw opening <output id="out-jaw"></output>
        <input id="jaw" type="range" min="0" max="1" step="0.01" value="0" />
      </label>
      <label>Base swivel <output id="out-swivel"></output>
        <input id="swivel" type="range" min="-90" max="90" step="1" value="0" />
      </label>
      <label>Explode <output id="out-explode"></output>
        <input id="explode" type="range" min="0" max="1" step="0.01" value="0" />
      </label>
      <label>Lighting
        <select id="lighting">
          <option value="reference">reference (studio)</option>
          <option value="neutral">neutral</option>
          <option value="grazing">grazing</option>
        </select>
      </label>
      <div id="picked">Click a part to identify it.</div>
      <div id="stats"></div>
    </div>
  </body>
  <script type="module" src="./src/main.ts"></script>
</html>
